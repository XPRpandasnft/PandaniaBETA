name: Apply Pandania gameplay fixes
on:
  push:
    paths:
      - 'Adventures Of Pandania The Lost Realms/index.html'
      - '.github/workflows/pandania-game-fixes.yml'
      - '.github/pandania_patch.py'
      - '.github/pandania_mobile_crit_zoom_patch.py'
      - '.github/pandania_v13_combat_input_patch.py'
permissions:
  contents: write
jobs:
  patch-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use current full game source
        run: |
          test -s "Adventures Of Pandania The Lost Realms/index.html"
          echo "Using current repository index.html as the source; no stale commit restore."
      - name: Apply final gameplay layer
        run: python3 .github/pandania_patch.py
      - name: Apply mobile zoom, crit, pickup, and joystick-only layer
        run: python3 .github/pandania_mobile_crit_zoom_patch.py
      - name: Apply V13 input, individual crit stats, crit visuals, and mobile monster width
        run: python3 .github/pandania_v13_combat_input_patch.py
      - name: Validate final HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Adventures Of Pandania The Lost Realms/index.html').read_text(encoding='utf-8')
          checks = [
            'PANDANIA FINAL STABLE PATCH v11',
            'PANDANIA MOBILE CRIT/ZOOM PATCH v12',
            'PANDANIA V13 COMBAT/INPUT PATCH',
            '__pandaniaWeaponCritStatsV13',
            'pandaniaWeaponGreenStats',
            'critChance',
            'critDamage',
            'CRITICAL!',
            'pickupGroundItemAt',
            'zoomAwareWorldPoint',
            'pandaniaMobileControls'
          ]
          for check in checks:
              assert check in s, f'Missing validation target: {check}'
          assert len(s) > 150000, 'Game source unexpectedly truncated'
          print('Pandania V13 validation passed')
          PY
      - name: Commit final game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Adventures Of Pandania The Lost Realms/index.html"
          git diff --cached --quiet || git commit -m "Fix Pandania V13 rebuild and apply gameplay updates [skip ci]"
          git push
