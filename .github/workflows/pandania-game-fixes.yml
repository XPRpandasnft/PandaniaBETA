name: Apply Pandania gameplay fixes
on:
  push:
    paths:
      - 'Adventures Of Pandania The Lost Realms/index.html'
      - '.github/workflows/pandania-game-fixes.yml'
      - '.github/pandania_patch.py'
permissions:
  contents: write
jobs:
  patch-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final gameplay layer
        run: python3 .github/pandania_patch.py
      - name: Validate v6 HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Adventures Of Pandania The Lost Realms/index.html').read_text(encoding='utf-8')
          checks = [
            'PANDANIA GAMEPLAY PATCH v6',
            "a:'left'", "arrowleft:'left'", "d:'right'", "arrowright:'right'",
            "w:'up'", "arrowup:'up'", "s:'down'", "arrowdown:'down'",
            'pandaniaMobileControls', 'pandaniaEquipment', 'card.ondblclick',
            'images/pda.png', 'AudioContext'
          ]
          for check in checks:
              assert check in s, f'Missing validation target: {check}'
          print('Pandania v6 validation passed')
          PY
      - name: Commit final game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Adventures Of Pandania The Lost Realms/index.html"
          git diff --cached --quiet || git commit -m "Deploy Pandania v6 mobile equipment update [skip ci]"
          git push
