name: Fix Boss4 Meteor Telegraph

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Boss4 renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Adventures Of Pandania The Lost Realms/index.html')
          s=p.read_text(encoding='utf-8')

          start=s.find('<!-- ===== FINAL TARGETED FIX: BACK WEAPON + BOSS4 METEORS ===== -->')
          end=s.find('<!-- ===== END FINAL TARGETED FIX ===== -->',start)
          if start<0 or end<0:
              raise SystemExit('Final Boss4 block not found')

          block=r'''<!-- ===== FINAL TARGETED FIX: BACK WEAPON + BOSS4 METEORS ===== -->
<script>
(function(){
  'use strict';

  /* Preserve the existing back-weapon behavior exactly. */
  pdDrawBackWeapon=function(){
    if(!player || !player.moving)return;
    const fy=Number(player.facingY)||0;
    if(fy>=-0.01)return;
    const name=pdCurrentWeaponName();
    const key=pdWeaponVisualKeys[name];
    const img=key?pdWeaponImage(key):null;
    const bob=Math.abs(Math.sin(player.walkTime))*3;
    ctx.save();
    ctx.translate(player.x,player.y+bob-55);
    ctx.rotate(-Math.PI/2);
    ctx.globalAlpha=.98;
    ctx.imageSmoothingEnabled=false;
    if(img)ctx.drawImage(img,-24,-24,48,48);
    else{
      ctx.fillStyle='#79542d';ctx.fillRect(-3,-5,6,18);
      ctx.fillStyle='#dedede';ctx.fillRect(-4,-24,8,20);
      ctx.fillStyle='#d39a4f';ctx.fillRect(-9,-8,18,4);
    }
    ctx.restore();
  };

  /* ===== BOSS4 METEOR TELEGRAPH — AUTHORITATIVE =====
     Exactly 3 targets every 2.5 seconds.
     Warning circle appears immediately and lasts 1 second.
     The meteor then falls to the exact stored target.
     Damage is applied ON IMPACT only. */
  window.__finalBoss4Meteors=[];
  window.__finalBoss4Next=0;
  window.__finalBoss4Image=null;

  function finalBoss4Image(){
    if(window.__finalBoss4Image)return window.__finalBoss4Image;
    const img=new Image();
    img.onload=function(){window.__finalBoss4Image=img;};
    img.onerror=function(){console.error('Boss4 attack image failed:',IMAGE_FOLDER+'metalmonsterspecialattack.png');};
    img.src=IMAGE_FOLDER+'metalmonsterspecialattack.png';
    window.__finalBoss4Image=img;
    return img;
  }

  function finalBoss4HasBoss(){
    return inDungeon && typeof dungeonLevel!=='undefined' && dungeonLevel===4 &&
      Array.isArray(monsters) && monsters.some(m=>m.type==='boss4'&&m.hp>0);
  }

  function finalBoss4SpawnVolley(now){
    const minX=140,maxX=Math.max(minX+1,dungeon.width-140);
    const minY=150,maxY=Math.max(minY+1,dungeon.height-150);
    for(let i=0;i<3;i++){
      const tx=minX+Math.random()*(maxX-minX);
      const ty=minY+Math.random()*(maxY-minY);
      window.__finalBoss4Meteors.push({
        targetX:tx,targetY:ty,
        x:tx,y:ty-360,
        warningUntil:now+1000,
        fallStart:0,
        falling:false,
        impactUntil:0
      });
    }
    finalBoss4Image();
  }

  function finalBoss4Tick(){
    if(!finalBoss4HasBoss()){
      window.__finalBoss4Meteors.length=0;
      window.__finalBoss4Next=0;
      return;
    }
    const now=performance.now();
    if(!window.__finalBoss4Next)window.__finalBoss4Next=now+2500;
    if(now>=window.__finalBoss4Next){
      finalBoss4SpawnVolley(now);
      window.__finalBoss4Next=now+2500;
    }
    for(let i=window.__finalBoss4Meteors.length-1;i>=0;i--){
      const q=window.__finalBoss4Meteors[i];
      if(!q.falling&&now>=q.warningUntil){
        q.falling=true;
        q.fallStart=now;
        q.x=q.targetX;
        q.y=q.targetY-360;
      }
      if(q.falling){
        const t=Math.min(1,(now-q.fallStart)/600);
        const eased=1-Math.pow(1-t,3);
        q.x=q.targetX;
        q.y=(q.targetY-360)+360*eased;
        if(t>=1){
          q.x=q.targetX;q.y=q.targetY;q.falling=false;q.impactUntil=now+220;
        }
      }else if(q.impactUntil&&now>q.impactUntil){
        window.__finalBoss4Meteors.splice(i,1);
      }
    }
  }

  function finalBoss4DrawWorld(){
    if(!finalBoss4HasBoss())return;
    finalBoss4Tick();
    const now=performance.now(),img=finalBoss4Image();
    for(const q of window.__finalBoss4Meteors){
      ctx.save();
      ctx.imageSmoothingEnabled=false;

      /* EXACT 48x48 warning area. This is the exact stored impact target. */
      if(!q.falling&&!q.impactUntil){
        const pulse=.62+Math.sin(now/90)*.18;
        ctx.globalAlpha=pulse;
        ctx.fillStyle='rgba(0,0,0,.78)';
        ctx.beginPath();ctx.ellipse(q.targetX,q.targetY,24,14,0,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(q.targetX,q.targetY,24,14,0,0,Math.PI*2);ctx.stroke();
      }

      /* Visible supplied Boss4 attack artwork during the entire fall. */
      if(q.falling){
        if(img&&img.complete&&img.naturalWidth>0){
          const p=Math.min(1,Math.max(0,(now-q.fallStart)/600));
          const w=84+10*p;
          const h=84+10*p;
          ctx.globalAlpha=1;
          ctx.shadowColor='#b13cff';ctx.shadowBlur=30;
          ctx.drawImage(img,q.x-w/2,q.y-h,w,h);
        }else{
          ctx.globalAlpha=1;ctx.fillStyle='#a735ff';ctx.shadowColor='#b13cff';ctx.shadowBlur=30;
          ctx.beginPath();ctx.arc(q.x,q.y-42,22,0,Math.PI*2);ctx.fill();
        }
      }

      if(q.impactUntil&&now<q.impactUntil){
        const p=Math.max(0,1-(q.impactUntil-now)/220);
        ctx.globalAlpha=.85*(1-p);
        ctx.fillStyle='#fff';ctx.shadowColor='#b13cff';ctx.shadowBlur=35;
        ctx.beginPath();ctx.arc(q.targetX,q.targetY,24+18*p,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
  }

  window.__finalBoss4Tick=finalBoss4Tick;
  window.__finalBoss4DrawWorld=finalBoss4DrawWorld;

  /* Do NOT add another damage system here. The existing Boss4 damage system
     remains authoritative; this layer only provides the matching visual target
     and projectile. */
  const previousFinalDraw=draw;
  draw=function(){
    previousFinalDraw.apply(this,arguments);
    if(!inDungeon||!finalBoss4HasBoss())return;
    const z=typeof pandaniaMobileZoom==='function'?pandaniaMobileZoom():1;
    const vw=W/z,vh=H/z;
    ctx.save();
    ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-camera.x-vw/2,-camera.y-vh/2);
    finalBoss4DrawWorld();
    ctx.restore();
  };
})();
</script>
'''
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')
          print('Boss4 block replaced')
          PY

      - name: Verify JavaScript syntax
        run: node --check "Adventures Of Pandania The Lost Realms/index.html"

      - name: Commit fixed game file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Adventures Of Pandania The Lost Realms/index.html"
          git commit -m "Fix Boss4 meteor telegraph and projectile renderer" || exit 0
          git push
